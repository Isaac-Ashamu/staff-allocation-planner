[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staff-session-recommender"
version = "0.1.0"
description = "Tenant-agnostic support-worker session allocation recommender core."
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["core/python"]
include = ["booking_recommender*"]
