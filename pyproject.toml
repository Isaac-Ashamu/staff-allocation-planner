[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staff-session-recommender"
version = "0.1.0"
description = "Tenant-agnostic support-worker session allocation recommender core."
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["pypdf>=4"]

[tool.setuptools.packages.find]
where = ["core/python"]
include = ["booking_recommender*"]

[project.scripts]
import-standardized-csv = "booking_recommender.import_cli:main"
allocate-sessions = "booking_recommender.allocation_cli:main"
workbook-adapter = "booking_recommender.adapters.workbook:main"
recommender-db = "booking_recommender.persistence_cli:main"
